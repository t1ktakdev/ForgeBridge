name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      registry_only:
        description: Publish MCP metadata for the existing npm version (main only)
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm + MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restrict Registry recovery to main
        if:
          github.event_name == 'workflow_dispatch' && inputs.registry_only && github.ref !=
          'refs/heads/main'
        run: |
          echo "::error::Registry recovery must run from main"
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@22
          cache: true
          run-install: false

      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.16.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify tag and release metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./package.json'); const s=require('./server.json'); const v=process.argv[1]; if(p.version!==v||s.version!==v||s.packages?.[0]?.version!==v){console.error({tag:v,package:p.version,server:s.version,registryPackage:s.packages?.[0]?.version}); process.exit(1)}" "$VERSION"

      - name: Run quality gate
        run: pnpm run check

      - name: Build and validate release artifact
        run: |
          pnpm run package:artifact
          pnpm run package:validate

      - name: Check whether this npm version already exists
        if: startsWith(github.ref, 'refs/tags/')
        id: npm-version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED="$(npm view "forgebridge@$VERSION" version 2>/dev/null || true)"
          if [[ "$PUBLISHED" == "$VERSION" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm
        if: startsWith(github.ref, 'refs/tags/') && steps.npm-version.outputs.exists != 'true'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm publish --access public --tag "$TAG"

      - name: Verify published npm package before Registry publication
        if:
          startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' &&
          inputs.registry_only && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const p = JSON.parse(await readFile('package.json', 'utf8'));
          const s = JSON.parse(await readFile('server.json', 'utf8'));
          if (s.name !== p.mcpName || s.version !== p.version ||
              s.packages?.length !== 1 || s.packages[0].registryType !== 'npm' ||
              s.packages[0].identifier !== p.name || s.packages[0].version !== p.version) {
            throw new Error('Local package and MCP Registry identity/version do not match');
          }
          const url = 'https://registry.npmjs.org/' + encodeURIComponent(p.name) + '/' + encodeURIComponent(p.version);
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error('Published npm metadata unavailable: HTTP ' + response.status);
          const published = await response.json();
          if (published.name !== p.name || published.version !== p.version || published.mcpName !== s.name) {
            throw new Error('Published npm package does not match MCP Registry identity/version');
          }
          console.log('Verified published package: ' + p.name + '@' + p.version);
          NODE

      - name: Install MCP Registry publisher
        if:
          startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' &&
          inputs.registry_only && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          curl --fail --location --retry 3 --output mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate MCP Registry metadata
        if:
          startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' &&
          inputs.registry_only && github.ref == 'refs/heads/main')
        run: ./mcp-publisher validate server.json

      - name: Publish MCP Registry metadata
        if:
          startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' &&
          inputs.registry_only && github.ref == 'refs/heads/main')
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
